AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Event Registration & Ticketing System - Serverless REST API
  (Lambda + API Gateway + DynamoDB)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active            # enables AWS X-Ray tracing (helps in Phase 4/5)
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        REGISTRATIONS_TABLE: !Ref RegistrationsTable
        POWERTOOLS_SERVICE_NAME: event-ticketing

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage

Resources:

  ##########################################
  # DynamoDB Tables
  ##########################################
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "EventRegistration-Events-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "EventRegistration-Registrations-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ##########################################
  # SNS Topic for Alarms
  ##########################################
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "event-ticketing-alarms-${Stage}"
      DisplayName: "Event Ticketing System Alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: rittaoppong9@gmail.com

  RegistrationConfirmationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "event-ticketing-confirmations-${Stage}"


  ##########################################
  # CloudWatch Alarms
  ##########################################
  RegisterFunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "event-ticketing-register-error-rate-${Stage}"
      AlarmDescription: "Triggers when RegisterFunction error rate exceeds 5%"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 5
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorRate
          Expression: "(errors / invocations) * 100"
          Label: "Error Rate %"
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RegisterFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RegisterFunction
            Period: 300
            Stat: Sum
          ReturnData: false
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "event-ticketing-api-5xx-rate-${Stage}"
      AlarmDescription: "Triggers when API Gateway 5xx responses exceed 5% of requests"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 5
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorRate
          Expression: "(serverErrors / requestCount) * 100"
          Label: "5xx Rate %"
        - Id: serverErrors
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5XXError
              Dimensions:
                - Name: ApiName
                  Value: !Sub "event-registration-ticketing-${Stage}"
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: requestCount
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiName
                  Value: !Sub "event-registration-ticketing-${Stage}"
            Period: 300
            Stat: Sum
          ReturnData: false
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
        
  RegisterFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "event-ticketing-register-duration-${Stage}"
      AlarmDescription: "Triggers if RegisterFunction p99 duration exceeds 8s (Timeout is 10s)"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref RegisterFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  RegistrationsTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "event-ticketing-registrations-throttle-${Stage}"
      AlarmDescription: "Triggers on any DynamoDB throttling on the Registrations table"
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref RegistrationsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  ##########################################
  # API Gateway
  ##########################################
  EventTicketingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"     # tighten this to your frontend domain in Phase 5

  ##########################################
  # CloudWatch Log Groups
  ##########################################
  RegisterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/event-ticketing-register-${Stage}"
      RetentionInDays: 14

  ListEventsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/event-ticketing-list-events-${Stage}"
      RetentionInDays: 14

  GetRegistrationsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/event-ticketing-get-registrations-${Stage}"
      RetentionInDays: 14

  CancelRegistrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/event-ticketing-cancel-registration-${Stage}"
      RetentionInDays: 14

  ##########################################
  # Lambda Functions
  ##########################################
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "event-ticketing-register-${Stage}"
      CodeUri: src/
      Handler: handlers.register.handler
      Environment:
        Variables:
          CONFIRMATION_TOPIC_ARN: !Ref RegistrationConfirmationTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt RegistrationConfirmationTopic.TopicName
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref EventTicketingApi
            Path: /register
            Method: POST

  
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "event-ticketing-list-events-${Stage}"
      CodeUri: src/
      Handler: handlers.list_events.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        ListEventsApi:
          Type: Api
          Properties:
            RestApiId: !Ref EventTicketingApi
            Path: /events
            Method: GET

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "event-ticketing-get-registrations-${Stage}"
      CodeUri: src/
      Handler: handlers.get_registrations.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        GetRegistrationsApi:
          Type: Api
          Properties:
            RestApiId: !Ref EventTicketingApi
            Path: /registrations/{email}
            Method: GET

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "event-ticketing-cancel-registration-${Stage}"
      CodeUri: src/
      Handler: handlers.cancel_registration.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      Events:
        CancelRegistrationApi:
          Type: Api
          Properties:
            RestApiId: !Ref EventTicketingApi
            Path: /registration/{id}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Description: "Base URL for the API Gateway stage"
    Value: !Sub "https://${EventTicketingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
  EventsTableName:
    Value: !Ref EventsTable
  RegistrationsTableName:
    Value: !Ref RegistrationsTable
